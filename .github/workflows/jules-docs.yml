name: Jules Docs Rewrite

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  jules-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jules Docs Rewrite
        uses: google-labs-code/jules-action@main
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Rewrite the docs and homepage in VerScript.github.io.
